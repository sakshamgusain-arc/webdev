<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: rgb(230, 110, 230);
        }
        div{
            background-color: red;
            border-radius: 20px;
        }
        .text{

            color: white;
            text-align: center;
                
        }
        .box1 {
            width: 400px;
            height: 400px;

            border: 4px solid black;

        }
       
        @media (min-width: 600px) {
            .box1 {
                background-color:yellow;
                border: 4px solid green;
            }
            .text {
                background-color:yellow;
                color: orangered;
            }
        }
        @media (min-width: 768px) {
            .box1 {
                background-color: aqua;
                border: 4px dotted blue;
            }
             .text {
                background-color: aqua;
                color: magenta;
            }
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="text">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Tempora at soluta aliquam eius praesentium ea nobis recusandae inventore reprehenderit neque?</div>
    </div>
</body>
</html>
