<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        div{
            position: relative;
            top: 10px;
            border: 2px solid black;
            height: 200px;
        
        
        }   
        .n1{
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .n2{
            position: absolute;
            
            right: 0px;
        }
        .n3{
            position: absolute;
            bottom: 0px;
            left: 0px;
        }
        .n4{
            position: absolute;
            bottom: 0px;
            right: 0px;
        }
           
        </style>
</head>
<body>
    <div>
        <p class="n1">saksham gusain</p>
        <p class="n2">saksham gusain</p>
        <p class="n3">saksham gusain</p>
        <p class="n4">saksham gusain</p>

    </div>

    
</body>
</html>
