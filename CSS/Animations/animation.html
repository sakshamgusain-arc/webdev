<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes myAnimation {
            0%   {background-color: purple; left: 0px; top: 0px;}
            25%  {background-color: yellow; left: 200px; top: 0px;}
            50%  {background-color: pink; left: 200px; top: 200px;}
            75%  {background-color: maroon; left: 0px; top: 200px;}
            100% {background-color: red; left: 0px; top: 0px;}
            0%  {color: red; }
            25%  {color: green;}
            50%  {color: blue;}
            75%  {color: orange;}
            100% {color: white}
        }
        @keyframes identifier {
            0%   {background-color: purple; left: 0px; top: 0px;}
            25%  {background-color: yellow; left: 70px; top: 0px;}
            50%  {background-color: pink; left: 70px; top: 80px;}
            75%  {background-color: maroon; left: 0px; top: 80px;}
            100% {background-color: red; left: 0px; top: 0px;}

        }
        
        @keyframes animation {
            0%   {background-color: purple; left: 300px; top: 0px;}
            25%  {background-color: yellow; left: 500px; top: 0px;}
            50%  {background-color: pink; left: 500px; top: 200px;}
            75%  {background-color: maroon; left: 300px; top: 200px;}
            100% {background-color: red; left: 300px; top: 0px;}
            
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: purple;
            animation-name: myAnimation;
            position: relative;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            /* animation-delay: -2s; */
            display: inline-block;

            animation-timing-function: cubic-bezier(0.1, 0.7, 1.0, 0.1);

             
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: purple;
            animation-name: animation;
            position: relative;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            /* animation-direction: alternate; */
            /* animation-delay: -2s; */
            animation-timing-function: cubic-bezier(0.1, 0.7, 1.0, 0.1);
            display: inline-block;
             
        }
        .content{
            background-color: purple;
            position: relative;
            animation-name: identifier;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            width: 30px;
            animation-timing-function: cubic-bezier(0.1, 0.7, 1.0, 0.1);                                

        }
        div{
            transition:rotate 100s;

        }
        div:hover{
            rotate: 36000deg;
        }
    </style>
</head>
<body>
         <div class="box1"><div class="content">box1</div></div>
         <div class="box2">box2</div>
</body>
</html>
